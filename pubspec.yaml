name: elecleap
description: ElecLeap photo frame companion.
publish_to: none
version: 0.6.0+1
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  image_picker: 1.2.1
  flutter_secure_storage: 9.2.4
  http: 1.6.0
  image: 4.7.2
  cryptography: 2.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
